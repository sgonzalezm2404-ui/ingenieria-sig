<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%" fill="none">
  <!-- S | G² Brand Mark White Version -->
  <g id="brand-mark" transform="translate(15, 15)">
    <!-- S -->
    <text x="0" y="115" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="125" font-weight="900" fill="#FFFFFF" letter-spacing="-2">S</text>
    <!-- Vertical divider bar -->
    <rect x="88" y="12" width="16" height="124" rx="3" fill="#00B4D8"/>
    <!-- G -->
    <text x="114" y="115" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="125" font-weight="900" fill="#FFFFFF" letter-spacing="-2">G</text>
    <!-- Superscript 2 -->
    <text x="206" y="52" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="54" font-weight="900" fill="#38BDF8">2</text>
  </g>

  <!-- Vertical separator line -->
  <line x1="268" y1="20" x2="268" y2="150" stroke="#475569" stroke-width="2"/>

  <!-- Corporate Title Matrix -->
  <g id="corporate-text" transform="translate(290, 20)">
    <!-- Row 1: SISTEMAS Y (White) | INTEGRADO (Cyan/Teal) | GEOGRÁFICO (White) -->
    <text x="0" y="32" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">SISTEMAS Y</text>
    <text x="138" y="32" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#00B4D8">INTEGRADO</text>
    <text x="272" y="32" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">GEOGRÁFICO</text>

    <!-- Row 2: SOLUCIONES (White) | E INGENIERÍA (Cyan/Teal) | Y GESTIÓN (White) -->
    <text x="0" y="60" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">SOLUCIONES</text>
    <text x="138" y="60" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#00B4D8">E INGENIERÍA</text>
    <text x="288" y="60" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Y GESTIÓN</text>

    <!-- Horizontal divider -->
    <line x1="0" y1="74" x2="435" y2="74" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 3: SISTEMAS Y SOLUCIONES -->
    <text x="0" y="98" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="800" fill="#E2E8F0" letter-spacing="1">SISTEMAS Y SOLUCIONES</text>

    <!-- Row 4: L O G Í S T I C A -->
    <text x="0" y="130" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="25" font-weight="400" fill="#94A3B8" letter-spacing="14">LOGÍSTICA</text>
  </g>
</svg>
