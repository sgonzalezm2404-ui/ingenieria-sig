<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sigNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3663"/>
      <stop offset="100%" stop-color="#0F4C81"/>
    </linearGradient>
    <linearGradient id="sigCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096C7"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Left Mark: s | G ² -->
  <g id="mark" transform="translate(10, 10)">
    <!-- Lowercase 's' -->
    <path d="M 12 75 C 5 75 0 70 0 62 L 18 62 C 18 65 21 67 26 67 C 32 67 36 64 36 60 C 36 55 31 53 22 50 C 9 46 2 41 2 29 C 2 18 11 12 25 12 C 38 12 47 18 48 29 L 31 29 C 30 24 27 21 23 21 C 18 21 15 23 15 27 C 15 31 19 33 28 36 C 41 40 49 45 49 57 C 49 70 39 75 12 75 Z" fill="#0A3663" />
    
    <!-- Vertical Divider Bar '|' -->
    <rect x="58" y="0" width="16" height="98" rx="2" fill="#0A3663" />
    
    <!-- Capital 'G' -->
    <path d="M 88 15 C 105 15 120 22 127 34 L 112 42 C 107 34 98 29 88 29 C 71 29 58 42 58 58 C 58 74 71 87 88 87 C 100 87 109 81 113 72 L 88 72 L 88 59 L 128 59 L 128 92 C 117 99 104 102 88 102 C 60 102 42 84 42 58 C 42 32 60 15 88 15 Z" transform="translate(40, -10)" fill="#0A3663" />

    <!-- Superscript '2' -->
    <path d="M 175 18 C 175 12 180 8 188 8 C 196 8 201 12 201 18 C 201 23 197 27 190 33 L 176 46 L 203 46 L 203 53 L 174 53 L 174 46 L 189 31 C 193 27 195 24 195 20 C 195 16 192 14 188 14 C 184 14 181 16 181 20 L 175 20 Z" transform="matrix(1.5 0 0 1.5 -85 -10)" fill="#0A3663" />
  </g>

  <!-- Vertical separator subtle -->
  <line x1="225" y1="20" x2="225" y2="95" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Right Descriptive Columns -->
  <g id="text-columns" transform="translate(235, 20)">
    <!-- Column 1: SISTEMAS Y SOLUCIONES (Navy) -->
    <text x="0" y="24" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#0A3663" letter-spacing="0.5">SISTEMAS Y</text>
    <text x="0" y="44" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#0A3663" letter-spacing="0.5">SOLUCIONES</text>

    <!-- Column 2: INTEGRADO E INGENIERÍA (Teal / Cyan) -->
    <text x="108" y="24" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#00838F" letter-spacing="0.5">INTEGRADO</text>
    <text x="108" y="44" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#00838F" letter-spacing="0.5">E INGENIERÍA</text>

    <!-- Column 3: GEOGRÁFICO Y GESTIÓN (Slate) -->
    <text x="218" y="24" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#334155" letter-spacing="0.5">GEOGRÁFICO</text>
    <text x="218" y="44" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#334155" letter-spacing="0.5">Y GESTIÓN</text>

    <!-- Sub-row: • SISTEMAS Y SOLUCIONES • -->
    <text x="85" y="66" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="2">• SISTEMAS Y SOLUCIONES •</text>

    <!-- Bottom sub-row: LOGÍSTICA -->
    <text x="110" y="80" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="6">LOGÍSTICA</text>
  </g>
</svg>