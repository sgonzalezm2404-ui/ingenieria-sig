<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%" fill="none">
  <!-- S | G² Brand Mark -->
  <g id="brand-mark" transform="translate(15, 15)">
    <!-- S -->
    <text x="0" y="115" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="125" font-weight="900" fill="#0A2540" letter-spacing="-2">S</text>
    <!-- Vertical divider bar -->
    <rect x="88" y="12" width="16" height="124" rx="3" fill="#0A2540"/>
    <!-- G -->
    <text x="114" y="115" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="125" font-weight="900" fill="#0A2540" letter-spacing="-2">G</text>
    <!-- Superscript 2 -->
    <text x="206" y="52" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="54" font-weight="900" fill="#0A2540">2</text>
  </g>

  <!-- Vertical separator line -->
  <line x1="268" y1="20" x2="268" y2="150" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Corporate Title Matrix -->
  <g id="corporate-text" transform="translate(290, 20)">
    <!-- Row 1: SISTEMAS Y (Navy) | INTEGRADO (Teal) | GEOGRÁFICO (Navy) -->
    <text x="0" y="32" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#0A2540">SISTEMAS Y</text>
    <text x="138" y="32" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#168F8A">INTEGRADO</text>
    <text x="272" y="32" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#0A2540">GEOGRÁFICO</text>

    <!-- Row 2: SOLUCIONES (Navy) | E INGENIERÍA (Teal) | Y GESTIÓN (Navy) -->
    <text x="0" y="60" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#0A2540">SOLUCIONES</text>
    <text x="138" y="60" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#168F8A">E INGENIERÍA</text>
    <text x="288" y="60" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="900" fill="#0A2540">Y GESTIÓN</text>

    <!-- Horizontal divider -->
    <line x1="0" y1="74" x2="435" y2="74" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Row 3: SISTEMAS Y SOLUCIONES -->
    <text x="0" y="98" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="800" fill="#33373B" letter-spacing="1">SISTEMAS Y SOLUCIONES</text>

    <!-- Row 4: L O G Í S T I C A -->
    <text x="0" y="130" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="25" font-weight="300" fill="#55595C" letter-spacing="14">LOGÍSTICA</text>
  </g>
</svg>
